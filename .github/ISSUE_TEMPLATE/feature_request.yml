name: 功能建议
description: 对玩法、配置或兼容性的建议
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: situation
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？现在遇到了什么限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 描述你期望的玩法或操作方式，不必先设计具体代码。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
      description: 如果你试过配置、数据包或其他办法，也可以写在这里。
